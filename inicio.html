<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Principal</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="sidebar">
        <h2>Menú</h2>
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Clientes</a></li>
            <li><a href="#">Tareas</a></li>
            <li><a href="#">Recordatorios</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Resumen General</h1>
            <div class="quick-actions">
                <button>+ Nuevo Cliente</button>
                <button>+ Nueva Tarea</button>
                <button>+ Nuevo Recordatorio</button>
            </div>
        </div>

        <div class="widgets">
            <div class="widget">
                <h3>Clientes Recientes</h3>
                <div class="list-item">Cliente 1</div>
                <div class="list-item">Cliente 2</div>
                <div class="list-item">Cliente 3</div>
                <div class="list-item">Cliente 4</div>
            </div>

            <div class="widget">
                <h3>Recordatorios</h3>
                <div class="list-item">Recordatorio 1</div>
                <div class="list-item">Recordatorio 2</div>
                <div class="list-item">Recordatorio 3</div>
                <div class="list-item">Recordatorio 4</div>
            </div>
            <div class="widget">
                <h3>Tarea</h3>
                <div class="list-item">Tarea 1</div>
                <div class="list-item">Tarea 2</div>
                <div class="list-item">Tarea 3</div>
                <div class="list-item">Tarea 4</div>
            </div>
            <div class="widget">
                <h3>Venta</h3>
                <div class="list-item">Venta 1</div>
                <div class="list-item">Venta 2</div>
                <div class="list-item">Venta 3</div>
                <div class="list-item">Venta 4</div>
            </div>
        </div>
    </div>
</body>
</html>
